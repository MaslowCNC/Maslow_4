; Maslow 4.1 ESP-NOW remote for the ELEGOO ESP32 touch displays:
;   cyd   2.8" ESP32-2432S028R, 240x320 ILI9341, XPT2046 touch on its own bus
;   cyd4  4.0" ESP32-32E (E32R40T), 320x480 ST7796, XPT2046 on the panel bus
;
; Build:   pio run -e cyd4
; Flash:   tools/flash.sh -e cyd4
; Console: tools/remote_cli.py (serial commands, screenshots)

[platformio]
default_envs = cyd

[env]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
; Share the pairing / anti-replay crypto with the Maslow firmware so both ends
; derive identical keys.
build_src_filter =
    +<*>
    +<../../firmware/FluidNC/esp32/ESPNow/ESPNowCrypto.cpp>
build_flags =
    -I../firmware/FluidNC/esp32/ESPNow
    -DCORE_DEBUG_LEVEL=0

[env:cyd]

[env:cyd4]
build_flags =
    ${env.build_flags}
    -DBOARD_CYD4
