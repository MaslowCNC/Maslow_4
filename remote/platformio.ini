; Maslow ESP-NOW remote for the 4.0" ESP32-S3 IPS display (Hosyond / lcdwiki
; ES3C40P): 320x480 ST7796S, FT6336U capacitive touch, native USB.
;
; Build:   pio run
; Flash:   tools/flash.sh
; Console: tools/remote_cli.py (serial commands, screenshots)

[platformio]
default_envs = es3c40p

[env:es3c40p]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
; Share the pairing / anti-replay crypto with the Maslow firmware so both ends
; derive identical keys.
build_src_filter =
    +<*>
    +<../../firmware/FluidNC/esp32/ESPNow/ESPNowCrypto.cpp>
build_flags =
    -I../firmware/FluidNC/esp32/ESPNow
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
