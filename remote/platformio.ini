; Maslow 4.1 ESP-NOW remote for the ELEGOO / ESP32-2432S028R "Cheap Yellow
; Display" (ESP32-WROOM, 2.8" 240x320 ILI9341, XPT2046 resistive touch).
;
; Build:   pio run
; Flash:   pio run -t upload
; Console: tools/remote_cli.py (serial commands, screenshots)

[env:cyd]
platform = https://github.com/pioarduino/platform-espressif32.git#55.03.39
board = esp32dev
framework = arduino
board_build.partitions = huge_app.csv
monitor_speed = 115200
upload_speed = 460800
lib_deps =
    lovyan03/LovyanGFX@^1.2.7
; Share the pairing / anti-replay crypto with the Maslow firmware so both ends
; derive identical keys.
build_src_filter =
    +<*>
    +<../../firmware/FluidNC/esp32/ESPNow/ESPNowCrypto.cpp>
build_flags =
    -I../firmware/FluidNC/esp32/ESPNow
    -DCORE_DEBUG_LEVEL=0
