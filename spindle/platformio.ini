[env:esp32-s3-devkitc-1]
; Using ESP32 Arduino 2.0.14 which includes ESP-IDF 4.4.6
; This version still supports the legacy MCPWM API needed by SimpleFOC
platform = espressif32@6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; OTA-capable partition layout (two ~1.9MB app slots) so the board can be reflashed
; wirelessly.  Flash this once over USB to install the new partition table.
board_build.partitions = min_spiffs.csv

; These flags are essential for S3 USB
build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps = 
    askuric/Simple FOC @ 2.3.2

; Wireless update over WiFi (ArduinoOTA / espota).  The board only listens for OTA after
; the XY board enables it via $Spindle/EnableOTA, which pushes the WiFi credentials over
; the inter-board link.  Then:  pio run -e esp32-s3-devkitc-1-ota -t upload
; Override the target with --upload-port <ip> if mDNS is unavailable.
[env:esp32-s3-devkitc-1-ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = maslow-spindle.local

; Bench build for the sensorless investigation: measures synchronised SOx sampling at boot with
; the motors idle and skips the power-up Z homing (see src/adc_timing_test.h).  Flash over WiFi
; after $Spindle/EnableOTA:  pio run -e adc-timing-ota -t upload --upload-port <ip>
[env:adc-timing-ota]
extends = env:esp32-s3-devkitc-1-ota
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D ADC_TIMING_TEST

; PWM-synchronised current sensing (src/current_sampler.h) + shadow-mode flux observer
; (src/sync_sense.h).  A complete, normal firmware otherwise - including power-up Z homing - so
; flashing it moves the Z.  USB: pio run -e sync-sense -t upload.
; WiFi, after $Spindle/EnableOTA:  pio run -e sync-sense-ota -t upload --upload-port <ip>
[env:sync-sense]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D SYNC_CURRENT_SENSE

[env:sync-sense-ota]
extends = env:esp32-s3-devkitc-1-ota
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -D SYNC_CURRENT_SENSE
