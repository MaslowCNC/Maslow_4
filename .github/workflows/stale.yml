name: Close Stale Issues and PRs

on:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  stale:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      issues: write
      pull-requests: write

    steps:
      - name: Close stale issues and PRs
        uses: actions/stale@v9
        with:
          # Issues configuration
          days-before-issue-stale: 30
          days-before-issue-close: 7
          stale-issue-label: 'stale'
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had recent activity for 30 days.
            It will be closed in 7 days if no further activity occurs.
            Thank you for your contributions.

          # Pull requests configuration
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: 'stale'
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has not had recent activity for 30 days.
            It will be closed in 7 days if no further activity occurs.
            Thank you for your contributions.

          # Closing messages
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If you believe this issue is still relevant, please feel free to reopen it or create a new issue.

          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            If you believe this PR is still relevant, please feel free to reopen it or create a new pull request.

          # Labels to exempt from being marked as stale
          exempt-issue-labels: 'pinned,security,important'
          exempt-pr-labels: 'pinned,security,important'

          # Only process issues/PRs with these labels (leave empty to process all)
          # only-labels: ''

          # Additional configuration
          operations-per-run: 100
          remove-stale-when-updated: true
          ascending: false
