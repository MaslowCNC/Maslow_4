name: Compile Firmware on MaslowBot Review Request

on:
  pull_request:
    types: [review_requested]
  issue_comment:
    types: [created]

jobs:
  compile-firmware:
    runs-on: ubuntu-latest
    
    # Run when MaslowBot is requested as reviewer OR when MaslowBot is mentioned in a comment on a PR
    # Handles both single reviewer (requested_reviewer) and multiple reviewers (requested_reviewers) scenarios
    # Also handles issue_comment trigger for Copilot-created PRs  
    if: |
      (github.event_name == 'pull_request' && (
        github.event.requested_reviewer.login == 'MaslowBot' ||
        contains(github.event.requested_reviewers.*.login, 'MaslowBot')
      )) ||
      (github.event_name == 'issue_comment' && 
        github.event.issue.pull_request != null &&
        (contains(github.event.comment.body, '@MaslowBot') || contains(github.event.comment.body, '/build'))
      )
    
    steps:
    - name: Get PR details for issue comment
      if: github.event_name == 'issue_comment'
      id: pr
      run: |
        PR_NUMBER=${{ github.event.issue.number }}
        PR_DATA=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/${{ github.repository }}/pulls/${PR_NUMBER}")
        echo "head_sha=$(echo "$PR_DATA" | jq -r .head.sha)" >> $GITHUB_OUTPUT
        
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # For issue_comment events, checkout the PR head commit instead of the default branch
        ref: ${{ github.event_name == 'issue_comment' && steps.pr.outputs.head_sha || github.sha }}
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
        
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-platformio-${{ hashFiles('**/platformio.ini') }}
        restore-keys: |
          ${{ runner.os }}-platformio-
          
    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: embedded/node_modules
        key: ${{ runner.os }}-npm-${{ hashFiles('embedded/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-npm-
          
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade platformio
        
    - name: Install npm dependencies
      run: |
        cd embedded
        npm install
        
    - name: Build embedded web page
      run: |
        cd embedded
        python3 build.py
        
    - name: Build firmware
      run: |
        pio run -e wifi_s3
        
    - name: Upload firmware as artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware.bin
        path: .pio/build/wifi_s3/firmware.bin
        retention-days: 30
        
    - name: Comment on PR with firmware info
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = '.pio/build/wifi_s3/firmware.bin';
          const stats = fs.statSync(path);
          const fileSizeInBytes = stats.size;
          const fileSizeInMB = (fileSizeInBytes / (1024*1024)).toFixed(2);
          
          // Determine the PR number and commit SHA based on the event type
          let prNumber, commitSha;
          if (context.eventName === 'pull_request') {
            prNumber = context.issue.number;
            commitSha = context.payload.pull_request.head.sha;
          } else if (context.eventName === 'issue_comment') {
            prNumber = context.issue.number;
            // Get the PR details to get the latest commit SHA
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            commitSha = pr.head.sha;
          }
          
          const triggerText = context.eventName === 'pull_request' 
            ? '_This comment was automatically generated when @MaslowBot was requested as a reviewer._'
            : '_This comment was automatically generated in response to a build request comment._';
          
          const comment = `🤖 **Firmware Compilation Complete** 🤖
          
          ✅ Successfully compiled FluidNC firmware for ESP32-S3 (wifi_s3 environment)
          
          **Build Details:**
          - Commit: \`${commitSha}\`
          - Environment: \`wifi_s3\`
          - Firmware size: ${fileSizeInMB} MB
          - Build time: ~2 minutes
          
          **Download:**
          The compiled firmware.bin file has been uploaded as a build artifact and can be downloaded from the [Actions tab](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).
          
          **Installation:**
          Use the install scripts in the \`install_scripts\` directory or flash directly with esptool.py:
          \`\`\`bash
          esptool.py --chip esp32s3 --baud 921600 \\
            --before default_reset --after hard_reset write_flash \\
            -z --flash_mode dio --flash_freq 80m --flash_size detect \\
            0x10000 firmware.bin
          \`\`\`
          
          ${triggerText}`;
          
          github.rest.issues.createComment({
            issue_number: prNumber,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: comment
          });