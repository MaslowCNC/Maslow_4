name: Relay Comments to Copilot

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  relay-comment:
    runs-on: ubuntu-latest
    
    if: |
      (contains(github.event.comment.body, '@MaslowBot') || contains(github.event.comment.body, '@maslowbot')) &&
      github.event.comment.user.login != 'MaslowBot'
    
    steps:
      - name: Relay comment to copilot
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.USER_GITHUB_TOKEN }}
          script: |
            const originalComment = context.payload.comment;
            const originalAuthor = originalComment.user.login;
            const originalBody = originalComment.body;
            
            if (originalBody.includes('@copilot-swe-agent')) {
              console.log('Comment already mentions @copilot-swe-agent, skipping relay');
              return;
            }
            
            if (originalBody.trim().length < 10) {
              console.log('Comment too short, skipping relay');
              return;
            }
            
            // Skip build trigger comments that are handled by the compile workflow
            const buildPatterns = [
              /(?:^|\s)build(?:\s|$)/i,  // build as a standalone word
              /(?:^|\s)compile(?:\s|$)/i, // compile as a standalone word  
              /\/build/i, // /build command
              /@MaslowBot\s+(please\s+)?build(?:\s|$)/i, // @MaslowBot (please) build
              /@MaslowBot\s+(please\s+)?compile(?:\s|$)/i // @MaslowBot (please) compile
            ];
            
            const isBuildComment = buildPatterns.some(pattern => pattern.test(originalBody));
            if (isBuildComment) {
              console.log('Comment appears to be a build trigger, skipping relay to avoid duplication');
              return;
            }
            
            const divider = '━'.repeat(80);
            const relayComment = '@copilot-swe-agent\n\nUser @' + originalAuthor + ' mentioned @MaslowBot with the following request:\n\n' + divider + '\n\n' + originalBody + '\n\n' + divider + '\n\n_This comment was automatically relayed by MaslowBot so that @copilot-swe-agent can respond to the request._';
            
            let issueNumber;
            if (context.eventName === 'issue_comment') {
              issueNumber = context.issue.number;
            } else if (context.eventName === 'pull_request_review_comment') {
              const prNumber = context.payload.pull_request.number;
              issueNumber = prNumber;
            }
            
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: relayComment
              });
              
              console.log('Successfully relayed comment from @' + originalAuthor + ' to @copilot-swe-agent on issue/PR #' + issueNumber);
            } catch (error) {
              console.error('Failed to relay comment:', error);
              core.setFailed('Failed to relay comment: ' + error.message);
            }