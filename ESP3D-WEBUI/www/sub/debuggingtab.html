<div id="debuggingtab" class="tabcontent">
  <div class="debugging-container">
    <div class="debugging-header">
      <h2 translate>Motor Current Monitoring</h2>
      <p translate>Real-time current draw for each motor in milliamps (mA)</p>
    </div>

    <div class="motor-test-panel">
      <h3>Motor Test Control</h3>
      <div class="motor-test-controls">
        <label for="motor-test-select">Motor</label>
        <select id="motor-test-select" onchange="onMotorSelectionChanged()">
          <option value="TL">Top Left</option>
          <option value="TR">Top Right</option>
          <option value="BL">Bottom Left</option>
          <option value="BR">Bottom Right</option>
        </select>
        <label for="motor-test-speed">Speed</label>
        <input id="motor-test-speed" type="number" min="-1023" max="1023" value="0" onchange="onMotorSpeedNumberChange()">
        <input id="motor-test-speed-range" type="range" min="-1023" max="1023" value="0" oninput="onMotorSpeedRangeChange()">
        <button type="button" onclick="applyMotorSpeed()">Set Speed</button>
        <button type="button" onclick="stopMotorTest()">Stop</button>
        <button type="button" onclick="requestSelectedMotorInfo()">Refresh</button>
      </div>
      <div class="motor-test-note">Changing the selected motor will stop active motor test output.</div>
      <div id="motor-test-info" class="motor-test-info">No motor info received yet.</div>
    </div>
    
    <div class="debugging-gauges">
      <!-- Top Left Corner Motor Gauge -->
      <div class="gauge-container">
        <div class="gauge-label" translate>Top Left Motor</div>
        <div class="gauge-wrapper">
          <svg class="gauge" width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="60" fill="none" stroke="#e0e0e0" stroke-width="8"/>
            <circle id="tlc-gauge-progress" cx="75" cy="75" r="60" fill="none" stroke="#4CAF50" stroke-width="8"
                    stroke-dasharray="377" stroke-dashoffset="377" stroke-linecap="round"
                    transform="rotate(-90 75 75)" style="transition: stroke-dashoffset 0.5s ease;"/>
            <text x="75" y="70" text-anchor="middle" class="gauge-value" id="tlc-value">0</text>
            <text x="75" y="85" text-anchor="middle" class="gauge-unit">mA</text>
          </svg>
        </div>
      </div>

      <!-- Top Right Corner Motor Gauge -->
      <div class="gauge-container">
        <div class="gauge-label" translate>Top Right Motor</div>
        <div class="gauge-wrapper">
          <svg class="gauge" width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="60" fill="none" stroke="#e0e0e0" stroke-width="8"/>
            <circle id="trc-gauge-progress" cx="75" cy="75" r="60" fill="none" stroke="#2196F3" stroke-width="8"
                    stroke-dasharray="377" stroke-dashoffset="377" stroke-linecap="round"
                    transform="rotate(-90 75 75)" style="transition: stroke-dashoffset 0.5s ease;"/>
            <text x="75" y="70" text-anchor="middle" class="gauge-value" id="trc-value">0</text>
            <text x="75" y="85" text-anchor="middle" class="gauge-unit">mA</text>
          </svg>
        </div>
      </div>

      <!-- Bottom Left Corner Motor Gauge -->
      <div class="gauge-container">
        <div class="gauge-label" translate>Bottom Left Motor</div>
        <div class="gauge-wrapper">
          <svg class="gauge" width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="60" fill="none" stroke="#e0e0e0" stroke-width="8"/>
            <circle id="blc-gauge-progress" cx="75" cy="75" r="60" fill="none" stroke="#FF9800" stroke-width="8"
                    stroke-dasharray="377" stroke-dashoffset="377" stroke-linecap="round"
                    transform="rotate(-90 75 75)" style="transition: stroke-dashoffset 0.5s ease;"/>
            <text x="75" y="70" text-anchor="middle" class="gauge-value" id="blc-value">0</text>
            <text x="75" y="85" text-anchor="middle" class="gauge-unit">mA</text>
          </svg>
        </div>
      </div>

      <!-- Bottom Right Corner Motor Gauge -->
      <div class="gauge-container">
        <div class="gauge-label" translate>Bottom Right Motor</div>
        <div class="gauge-wrapper">
          <svg class="gauge" width="150" height="150" viewBox="0 0 150 150">
            <circle cx="75" cy="75" r="60" fill="none" stroke="#e0e0e0" stroke-width="8"/>
            <circle id="brc-gauge-progress" cx="75" cy="75" r="60" fill="none" stroke="#F44336" stroke-width="8"
                    stroke-dasharray="377" stroke-dashoffset="377" stroke-linecap="round"
                    transform="rotate(-90 75 75)" style="transition: stroke-dashoffset 0.5s ease;"/>
            <text x="75" y="70" text-anchor="middle" class="gauge-value" id="brc-value">0</text>
            <text x="75" y="85" text-anchor="middle" class="gauge-unit">mA</text>
          </svg>
        </div>
      </div>
    </div>

    <div class="debugging-info">
      <div class="info-section">
        <h3 translate>Last Update</h3>
        <div id="last-update" class="last-update" translate>No data received</div>
      </div>
    </div>
  </div>
</div>
