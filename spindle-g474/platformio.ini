; Spindle firmware for the 36 V Unified Control Board (branch 36V-G474-spindle): an STM32G474RBT3
; running both spindle motors sensorless through two DRV8300 gate drivers.  See README.md for the
; architecture and BRINGUP.md for what is untested and how to bring a board up safely.
;
; Build:   pio run
; Flash:   pio run -t upload        (ST-LINK on the TC2030 pad J1; needs the sandbox off)
; The XY board can also flash it through the G474's ROM bootloader on USART2 ($Spindle/Flash).
[platformio]
default_envs = g474

[env:g474]
platform = ststm32@20.0.0
; Arduino core 2.12, the same one the ESC1 sensorless bench build used (spindle-esc1/).
platform_packages = platformio/framework-arduinoststm32@4.21200.0
board = maslow_g474rb
framework = arduino
upload_protocol = stlink
debug_tool = stlink
build_unflags = -Os
build_flags =
    -O2
    -Wall
    -Wno-unused-function
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF   ; link status lines print floats
    -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_SCANF    ; '#' maintenance commands parse float arguments (sscanf %f)
    -D PIO_FRAMEWORK_ARDUINO_SERIAL_WITHOUT_GENERIC ; no default Serial (it would be LPUART1 on the link pins)
    -D SERIAL_TX_BUFFER_SIZE=1024                  ; link lines never block the main loop
    -D SERIAL_RX_BUFFER_SIZE=256
    -D TICK_INT_PRIORITY=2                         ; the FOC interrupt (priority 0) preempts SysTick
    -D UART_IRQ_PRIO=3                             ; ... and the link UART
    -D HAL_OPAMP_MODULE_ENABLED                    ; shunt PGAs
    -D HAL_COMP_MODULE_ENABLED                     ; hardware over-current

; Same firmware, but nothing moves at boot: no power-up Z homing (home with $Spindle/Home).
; Use this for the first power-up of a new board (BRINGUP.md).
[env:g474-bench]
extends = env:g474
build_flags =
    ${env:g474.build_flags}
    -D BENCH_NO_HOMING
    -D BOOT_TRACE                                  ; one MSG:boot line per init step (BRINGUP.md)
